name: Agents Issue Format Guard

# Every automated lane in this repo reaches an issue through a LABEL. An issue
# filed with no label and no Tasks/Acceptance block is therefore invisible to the
# entire pipeline: nothing validates it, nothing optimises it, nothing claims it.
# That is exactly how #406-409 (good audit findings from the local
# automation_audit.py) sat unactionable.
#
# This guard closes that hole at the only point that catches every filer —
# local scripts, agents, humans, other repos — the server side.
#
# It deliberately does NOT try to rewrite the issue. It applies `agents:format`,
# which is the label the existing Agents Issue Optimizer already listens for,
# so a non-conforming issue gets ROUTED to the machinery that fixes it rather
# than merely flagged. `agents:formatted` marks an issue already handled so the
# guard does not fight the optimizer's own edits.

on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue to (re)check"
        required: true
        type: string

permissions:
  issues: write
  contents: read

concurrency:
  # One check per issue; a rapid edit burst should not race itself.
  group: issue-format-guard-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve issue
        id: iss
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          set -euo pipefail
          gh issue view "$NUM" --repo "$GITHUB_REPOSITORY" \
            --json number,body,labels,state > issue.json
          {
            echo "number=$NUM"
            echo "state=$(jq -r .state issue.json)"
            echo "formatted=$(jq -r '[.labels[].name] | index("agents:formatted") != null' issue.json)"
          } >> "$GITHUB_OUTPUT"
          jq -r '.body // ""' issue.json > body.md

      - name: Validate against AGENT_ISSUE_FORMAT
        id: validate
        if: steps.iss.outputs.formatted != 'true'
        run: |
          set +e
          python -m fine_art_archive.issue_format body.md > report.md
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          cat report.md
        env:
          PYTHONPATH: src

      - name: Route non-conforming issue to the optimizer
        if: steps.iss.outputs.formatted != 'true' && steps.validate.outputs.rc != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ steps.iss.outputs.number }}
        run: |
          set -euo pipefail
          # Only comment once per body-state, so an edit loop cannot spam the thread.
          FP="$(sha256sum body.md | cut -c1-12)"
          if gh issue view "$NUM" --repo "$GITHUB_REPOSITORY" --json comments \
               --jq '.comments[].body' | grep -qF "format-guard:$FP"; then
            echo "Already reported for this body revision ($FP)."
          else
            {
              cat report.md
              echo
              echo "Applying \`agents:format\` so the Agents Issue Optimizer can"
              echo "restructure this into an agent-processable work order."
              echo
              echo "<!-- format-guard:$FP -->"
            } | gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body-file -
          fi
          gh issue edit "$NUM" --repo "$GITHUB_REPOSITORY" --add-label "agents:format"

      - name: Clear the flag when an issue now conforms
        if: steps.iss.outputs.formatted != 'true' && steps.validate.outputs.rc == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ steps.iss.outputs.number }}
        run: |
          set -euo pipefail
          if gh issue view "$NUM" --repo "$GITHUB_REPOSITORY" --json labels \
               --jq '.labels[].name' | grep -qx 'agents:format'; then
            gh issue edit "$NUM" --repo "$GITHUB_REPOSITORY" --remove-label "agents:format"
            echo "Conforms now — cleared agents:format."
          fi
