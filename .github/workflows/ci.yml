# Thin caller for Python CI - delegates to Workflows repo reusable workflow
# No local scripts required - all logic is centralized in stranske/Workflows
#
# This workflow runs:
# - Lint (Ruff)
# - Format check (Black)
# - Type checking (mypy)
# - Tests (pytest) on Python 3.12 and 3.13
#
# NOTE: Do NOT add a top-level 'permissions:' block here. It causes
# startup_failure when calling reusable workflows. The reusable workflow
# defines its own permissions.
#
# NOTE: Do NOT add a 'pull_request:' trigger here. Gate (pr-00-gate.yml)
# already runs the same reusable Python CI on every pull request. Adding
# a parallel pull_request trigger here causes a second concurrent
# invocation of the reusable workflow that hits a startup_failure
# (interaction between secrets: inherit and pull_request from same-repo
# branches). Production consumers (Counter_Risk, Inv-Man-Intake,
# Trend_Model_Project, etc.) all omit pull_request: from ci.yml.
#
# Copy this file to: .github/workflows/ci.yml
# Also copy: autofix-versions.env to .github/workflows/autofix-versions.env
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  python:
    name: Python CI
    uses: stranske/Workflows/.github/workflows/reusable-10-ci-python.yml@main
    with:
      python-versions: '["3.12", "3.13"]'
      typecheck: true
      coverage: true
      # Post-port baseline; ratchet toward 80 as issues #3/#4/#5 add module tests.
      # RAISED 25 -> 81 on 2026-08-26. Measured coverage is 81.45%, so 25 sat 56 points below
      # reality: a floor that cannot fail reports a pass on any input and tells you nothing.
      # Matches config/coverage-baseline.json, set at the same measured current in #610, so
      # the soft gate's Status line and the guard's baseline comparison agree about this repo
      # instead of disagreeing by 56 points.
      #
      # Deliberately NOT rounded up to the measured 81.45: a floor exactly at current has no
      # room for run-to-run jitter, and the guard's own warn_drop of 1.0 is the tolerance.
      # This is a ratchet -- raise it as coverage rises, never lower it to make a run pass.
      coverage-min: '81'
    secrets: inherit
