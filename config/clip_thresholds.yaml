contrastive_pairs:
  filter:nudity-full:
    positive: fully nude figure as the subject of the work
    negatives: [fully clothed figure]
    margin: 0.0
  filter:nudity-partial:
    positive: figure with partial nudity, exposed chest or buttocks
    negatives: [fully clothed figure]
    margin: 0.0
  filter:weapon-prominent:
    positive: weapon held or prominently displayed
    negatives: [no weapon present]
    margin: 0.0
  filter:occult:
    positive: occult symbol or ritual imagery
    negatives: [no occult symbol or ritual imagery]
    margin: 0.0
  palette:monochrome:
    positive: monochromatic or grayscale
    negatives: [predominantly colorful artwork]
    margin: 0.0
