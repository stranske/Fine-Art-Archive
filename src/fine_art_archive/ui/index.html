          <td><strong>${acqEsc(g.label)}</strong>${flag}
              ${g.note ? `<br><span class="sub">${acqEsc(g.note)}</span>` : ""}</td>
          <td>${g.blocking}</td><td>${drain}</td>
          <td><span class="sub">${acqEsc(g.clears_by)}</span></td>
          <td>${open}</td>
        </tr>`;
      }
      html += "</tbody></table>";
      if (d.unmeasured_gates.length) {
        html += `<p class="sub" style="margin-top:12px">Could not measure:
          <strong>${acqEsc(d.unmeasured_gates.join(", "))}</strong>. That is a defect
          report, not an all-clear — a gate that cannot say what would clear it is
          already broken.</p>`;
      }
      det.innerHTML = html;
      window.scrollTo({top: det.offsetTop - 20, behavior: "smooth"});
    }

    async function loadReviewGate(name) {
      const det = showDetailPanel();
      if (!det) return;
      let g;
      try {
        const r = await fetch(`/review/${encodeURIComponent(name)}?limit=200`);
        if (!r.ok) { showReviewLoadError(det, ` (${r.status})`); return; }
        g = await r.json();
      } catch (e) {
        console.warn("Could not load review gate", e);
        showReviewLoadError(det);
        return;
      }
      let html = `<button onclick="loadReview()">← All gates</button>
        <h2>${acqEsc(g.label)}</h2>
        <p class="sub">Holding ${g.blocking}; ${g.drainable_measured ? g.drainable : "an unmeasured number"}
        clearable now. Clears by: ${acqEsc(g.clears_by)}.</p>`;
      if (g.note) html += `<p class="sub">${acqEsc(g.note)}</p>`;
      if (!g.items.length) { html += `<p class="sub">Nothing held.</p>`; det.innerHTML = html; return; }

      // routed_to_review is a WORK gate. Offering "Approve artist" beside its
      // rows contradicted the card that decides them one at a time, and an
      // approval here would have answered a question nobody asked.
      const isArtistGate = g.name === "new_artist";
      const cardView = GATE_VIEW[g.name];
      if (cardView) {
        html += `<p style="margin:8px 0"><button onclick="${cardView}">
          <strong>Judge these one at a time, with the pictures →</strong></button>
          <span class="sub">this table is for scanning; it cannot show you enough to decide</span></p>`;
      }
      html += `<table><thead><tr>
        <th></th><th>Item</th><th>Why it is held</th>${isArtistGate ? "<th>Artist</th><th></th>" : ""}
      </tr></thead><tbody>`;
      for (const it of g.items) {
        const ready = it.would_pass_now === false
          ? ` <span class="sub" title="a screening gate is unevaluated, so this is not ready even if the artist is approved">not ready</span>` : "";
        let action = "";
        if (isArtistGate && it.artist_qid) {
          const aq = acqEsc(JSON.stringify(it.artist_qid));
          action = `<td>
            <button onclick="artistDecide(${aq}, 'approve')">Approve artist</button>
            <button onclick="artistDecide(${aq}, 'reject')">Never</button></td>`;
        } else if (isArtistGate) {
          action = `<td><span class="sub">no artist Q-ID</span></td>`;
        }
        html += `<tr>
          <td style="width:130px">${(g.item_kind === "held_work"
              || (!g.item_kind && !/^Q[1-9][0-9]*$/.test(it.id || "")))
              ? heldThumb(it.id, 120)
              : candThumb(it.id, 120)}</td>
          <td><strong>${acqEsc(it.title || it.id)}</strong>${ready}<br>
              <span class="qid">${acqEsc(it.id)}</span></td>
          <td><span class="sub">${acqEsc(it.why || "")}</span></td>
          ${isArtistGate ? `<td>${it.artist_label
              ? acqEsc(it.artist_label)
              : `<span class="qid">${acqEsc(it.artist_qid || "—")}</span>`}</td>` : ""}
          ${action}
        </tr>`;
      }
      html += "</tbody></table>";
      det.innerHTML = html;
    }

    async function artistDecide(artistQid, decision) {
      const r = await fetch(`/review/artists/${encodeURIComponent(artistQid)}/decision`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({decision: decision})
      });
      if (!r.ok) { alert(`Could not record that (${r.status}).`); return; }
      await loadReview();
      refreshReviewBadge();
    }

    // ----- artist approval: one decision per ARTIST, not per work -----
    // Approving an artist releases every work by them, so 218 held works are
    // 116 decisions. Clicking 218 times for 116 outcomes is how a review
    // surface turns into the backlog it exists to prevent.
    //
    // Keyboard-first (A / R / S, arrows to move, Esc to leave) because the
    // whole point is that this can be cleared in one sitting and abandoned
    // half-done without consequence: nothing here expires and growth never
    // waits on it.
    let approveQueue = [];
    let approveShowAll = false;
    let approveIdx = 0;
    let approveDone = 0;

    async function loadApproval() {
      const r = await fetch("/review/artists?limit=500");
      const det = showDetailPanel();
      if (!det) return;
      if (!r.ok) { det.innerHTML = `<h2>Approve artists</h2><p class="sub">Could not load (${r.status}).</p>`; return; }
      const d = await r.json();
      approveQueue = d.artists || [];
      approveIdx = 0;
      approveDone = 0;
      if (!approveQueue.length) {
        det.innerHTML = `<button onclick="loadReview()">← All gates</button>
          <h2>Approve artists</h2>
          <p class="sub">Nothing waiting. Every artist in the frontier has been decided.</p>`;
        return;
      }
      renderApproval();
      if (!window._approveKeys) {
        window._approveKeys = true;
        document.addEventListener("keydown", approveKey);
      }
    }

    function approveKey(ev) {
      if (!approveQueue.length) return;
      const panel = document.getElementById("approve-card");
      if (!panel) return;                       // only while the view is open
      if (ev.target && /INPUT|TEXTAREA/.test(ev.target.tagName)) return;
      const k = ev.key.toLowerCase();
      if (k === "a") { ev.preventDefault(); approveAct("approve"); }
      else if (k === "r") { ev.preventDefault(); approveAct("reject"); }
      else if (k === "s" || k === "arrowright") { ev.preventDefault(); approveSkip(1); }
      else if (k === "arrowleft") { ev.preventDefault(); approveSkip(-1); }
      else if (k === "escape") { ev.preventDefault(); loadReview(); }
    }

    function approveSkip(delta) {
      approveShowAll = false;
      if (!approveQueue.length) return;
      approveIdx = (approveIdx + delta + approveQueue.length) % approveQueue.length;
      renderApproval();
    }

    async function approveAct(decision) {
      const cur = approveQueue[approveIdx];
      if (!cur) return;
      approveShowAll = false;
      const r = await fetch(`/review/artists/${encodeURIComponent(cur.artist_qid)}/decision`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({decision: decision, artist_name: cur.artist_label || ""})
      });
      if (!r.ok) { alert(`Could not record that (${r.status}).`); return; }
      approveQueue.splice(approveIdx, 1);
      approveDone += 1;
      if (approveIdx >= approveQueue.length) approveIdx = 0;
      refreshReviewBadge();
      if (!approveQueue.length) {
        const det = showDetailPanel();
        if (det) det.innerHTML = `<button onclick="loadReview()">← All gates</button>
          <h2>All done</h2>
          <p class="sub">${approveDone} artist${approveDone === 1 ? "" : "s"} decided.
          Their works become acquirable on the next growth tick.</p>`;
        return;
      }
      renderApproval();
    }

    // Re-request an image that failed, backing off. The proxy returns 503 while
    // the upstream source is throttling; giving up on the first failure is what
    // left blank squares on the card.
    function approveRetryImage(img) {
      const n = (parseInt(img.dataset.tries || "0", 10) || 0) + 1;
      img.dataset.tries = String(n);
      if (n > 4) {
        img.alt = "image unavailable";
        return;
      }
      const base = img.src.split("&_r=")[0];
      setTimeout(() => { img.src = `${base}${base.includes("?") ? "&" : "?"}_r=${n}`; }, 700 * Math.pow(2, n - 1));
    }

    // Returns u if it is http(s), otherwise "#" — prevents javascript: injection.
    function safeHref(u) {
      return /^https?:\/\//i.test(u || "") ? u : "#";
    }

    // Every screen that asks for a decision must SHOW the thing being decided.
    // These build <img> tags that go through the app's resizing/caching routes,
    // never a raw remote original — see the approval-card fix for what raw
    // hotlinks cost (1.7 MB into a 150 px box, then rate-limited into blanks).
    function decisionThumb(src, alt, px, bigSrc) {
      // Always clickable. A thumbnail you cannot enlarge is useless on a page
      // that asks you to judge a picture.
      const rawFull = bigSrc || src.replace(/([?&])(width|max)=\d+/, "$1$2=1600");
      const full = acqEsc(rawFull);
      return `<a href="${full}" target="_blank" rel="noopener" title="open full size">
        <img src="${src}" alt="${acqEsc(alt || "")}" loading="lazy"
          onerror="approveRetryImage(this)"
          style="width:${px}px;height:${px}px;object-fit:cover;border-radius:4px;
                 background:var(--card,#f3f3f3);vertical-align:middle;cursor:zoom-in"></a>`;
    }
    // Same picture, no anchor. The sibling grid wraps its thumbnails in a jump
    // link, and an <a> inside an <a> is invalid — the browser closes the outer
    // one, so the click would have opened the raw JPEG instead of the card.
    function plainThumb(src, alt, px) {
      return `<img src="${src}" alt="${acqEsc(alt || "")}" loading="lazy"
          onerror="approveRetryImage(this)"
          style="width:${px}px;height:${px}px;object-fit:cover;border-radius:4px;
                 background:var(--card,#f3f3f3);vertical-align:middle;cursor:pointer">`;
    }
    const heldThumb = (wid, px) => decisionThumb(`/works/${encodeURIComponent(wid)}/image?max=${px * 2}`, wid, px);
    const candThumb = (qid, px) => decisionThumb(`/review/candidate/${encodeURIComponent(qid)}/image?width=${px * 2}`, qid, px);

    // ----- per-WORK review: keep the painter, drop the picture -----
    // Approving an artist released 555 works across 98 painters. Artist-level
    // consent cannot say "this one, not that one", so this screen is where a
    // single picture is refused without refusing whoever painted it.
    let workReviewQueue = [];
    let workReviewIdx = 0;
    let workReviewDone = 0;

    let workReviewSource = "approved";

    async function loadWorkReview(source) {
      workReviewSource = source || "approved";
      const det = showDetailPanel();
      if (!det) return;
      let r;
      try {
        r = await fetch(`/review/works?limit=400&source=${encodeURIComponent(workReviewSource)}`);
      } catch (e) {
        det.innerHTML = `<h2>Review works</h2><p class="sub">Network error: ${acqEsc(String(e))}.</p>`;
        return;
      }
      if (!r.ok) { det.innerHTML = `<h2>Review works</h2><p class="sub">Could not load (${r.status}).</p>`; return; }
      let d;
      try {
        d = await r.json();
      } catch (e) {
        det.innerHTML = `<h2>Review works</h2><p class="sub">Bad response body.</p>`;
        return;
      }
      workReviewQueue = d.works || [];
      workReviewIdx = 0; workReviewDone = 0;
      if (!workReviewQueue.length) {
        // The empty message must name the queue it is empty FOR. One shared
        // sentence told you the rights queue was clear because approved-artist
        // works had been looked at — an all-clear about a different question.
        const empty = {
          routed: "Nothing waiting. Every work the screener routed to you has been decided.",
          rights: "Nothing waiting. No candidate is held on an undetermined rights status.",
        }[workReviewSource] ||
          "Nothing waiting. Every work released by an approved artist has been looked at.";
        det.innerHTML = `<button onclick="loadReview()">← All gates</button>
          <h2>${workReviewSource === "rights" ? "Rights could not be determined"
                : workReviewSource === "routed" ? "Works the screener routed to you"
                : "Works released by an approved artist"}</h2>
          <p class="sub">${empty}
          <span class="sub">(${d.already_decided} works decided in all, ${d.already_rejected} refused.)</span></p>`;
        return;
      }
      renderWorkReview();
      if (!window._workReviewKeys) { window._workReviewKeys = true; document.addEventListener("keydown", workReviewKey); }
    }

    function workReviewKey(ev) {
      if (!workReviewQueue.length || !document.getElementById("work-card")) return;
      if (ev.target && /INPUT|TEXTAREA/.test(ev.target.tagName)) return;
      if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
      const k = ev.key.toLowerCase();
      if (k === "k") { ev.preventDefault(); workReviewAct(workReviewSource === "rights" ? "force" : "keep"); }
      else if (k === "x") { ev.preventDefault(); workReviewAct("reject"); }
      else if (k === "s" || k === "arrowright") { ev.preventDefault(); workReviewSkip(1); }
      else if (k === "arrowleft") { ev.preventDefault(); workReviewSkip(-1); }
      else if (k === "escape") { ev.preventDefault(); loadReview(); }
    }

    function workReviewSkip(delta) {
      if (!workReviewQueue.length) return;
      workReviewIdx = (workReviewIdx + delta + workReviewQueue.length) % workReviewQueue.length;
      renderWorkReview();
    }

    async function workReviewAct(decision) {
      const cur = workReviewQueue[workReviewIdx];
      if (!cur) return;
      const r = await fetch(`/review/works/${encodeURIComponent(cur.id)}/decision`, {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({decision: decision, title: cur.title || ""})
      });
      if (!r.ok) { alert(`Could not record that (${r.status}).`); return; }
      workReviewQueue.splice(workReviewIdx, 1);
      workReviewDone += 1;
      if (workReviewIdx >= workReviewQueue.length) workReviewIdx = 0;
      if (!workReviewQueue.length) {
        const det = showDetailPanel();
        if (det) det.innerHTML = `<button onclick="loadReview()">← All gates</button>
          <h2>All done</h2><p class="sub">${workReviewDone} work${workReviewDone === 1 ? "" : "s"} decided.</p>`;
        return;
      }
      renderWorkReview();
    }

    function slCount(v) {
      if (typeof v === "number") return v;
      if (v && typeof v === "object") return Object.keys(v).length;
      return 0;

    // One card = one picture. The queue this renders is a WORK queue: keeping
    // or refusing here never touches the painter, and the painter's other
    // waiting pictures each get their own card. The page used to say the
    // opposite in three places at once ("released by approving this artist",
    // a gate whose "what clears it" read "approving the artist", and a silent
    // grid of the artist's other works with no buttons), so it was impossible
    // to tell whether a click decided a picture or a person.
    function workReviewJump(qid) {
      const i = workReviewQueue.findIndex(x => x.id === qid);
      if (i < 0) return;
      workReviewIdx = i;
      renderWorkReview();
    }

    function workReviewWhy(w) {
      const f = w.routing_flags || {};
      const bits = [];
      if (f.depicts && f.depicts.length) {
        bits.push(`<li><strong>Subject flagged:</strong> ` + f.depicts.map(d => d.label
          ? acqEsc(d.label)
          : `<a href="https://www.wikidata.org/wiki/${acqEsc(d.qid)}" target="_blank" rel="noopener">${acqEsc(d.qid)}</a>`
        ).join(", ") + ` — the screener will not take this on its own.</li>`);
      }
      if (f.near_title) {
        // Naming the title and stopping there asks you to remember a painting.
        // The held picture goes on the page, or the page says why it could not.
        const nh = f.near_held || {};
        let side = "";
        if (nh.lookup === "unavailable") {
          side = `<div class="sub" style="margin:6px 0">The archive could not be read, so the
            picture you already hold is not shown here. That is a failure to look it up, not a
            finding that nothing similar is held.</div>`;
        } else if (nh.matches && nh.matches.length) {
          side = `<div style="display:flex;gap:10px;flex-wrap:wrap;margin:6px 0">
            ${nh.matches.map(m => `<figure style="margin:0;width:150px">
              ${heldThumb(m.work_id, 150)}
              <figcaption class="sub" style="font-size:11px;line-height:1.3;margin-top:3px">
                already held · ${acqEsc(m.title || m.work_id)}</figcaption>
            </figure>`).join("")}
          </div>`;
        } else if (nh.lookup === "ok") {
          side = `<div class="sub" style="margin:6px 0">No held work by this artist actually
            matches that title — the screener's similarity flag looks spurious here.</div>`;
        }
        bits.push(`<li><strong>Looks like one you already hold:</strong>
          “${acqEsc(f.near_title)}”${f.near_score != null ? ` (title overlap ${f.near_score})` : ""}
          — the question is whether this is the same painting.${side}</li>`);
      }
      if (f.ambiguous_alias) {
        bits.push(`<li><strong>Ambiguous title:</strong> “${acqEsc(f.ambiguous_alias)}” matches
          too many works to identify it mechanically.</li>`);
      }
      if (f.held_by_artist != null) {
        bits.push(`<li>The archive already holds <strong>${f.held_by_artist}</strong> work${f.held_by_artist === 1 ? "" : "s"}
          by this artist${f.variants != null ? `, and ${f.variants} candidate variant${f.variants === 1 ? "" : "s"} of this one exist` : ""}.</li>`);
      }
      if (!bits.length) return `<p class="sub">The screener recorded no reason for routing this
        one. That is a gap in the screener, not a clean bill — judge it on the picture.</p>`;
      return `<ul class="sub" style="margin:8px 0 0;padding-left:18px;line-height:1.5">${bits.join("")}</ul>`;
    }

    function renderWorkReview() {
      const w = workReviewQueue[workReviewIdx];
      const det = showDetailPanel();
      if (!det || !w) return;
      const artist = w.artist_label
        ? acqEsc(w.artist_label)
        : `<span class="qid">${acqEsc(w.artist_qid || "unknown")}</span>`;
      // An unprobed candidate has no size and no rights determination. Omitting
      // the numbers silently would let "never measured" read as "measured and
      // poor" — the same conflation that made a failed download look like a
      // low-quality picture.
      const quality = w.probed
        ? `${w.megapixels ? ` · ${w.megapixels} MP` : ""}${w.rights_status ? ` · ${acqEsc(w.rights_status)}` : ""}`
        : ` · <span title="no file has been fetched, so there is no size or rights determination yet">size not yet measured</span>`;
      det.innerHTML = `<div id="work-card">
        <button onclick="loadReview()">← All gates</button>
        <p class="sub" style="margin:8px 0 0">Work ${workReviewIdx + 1} of ${workReviewQueue.length}
          · <strong>you are deciding this one picture</strong>, not the artist — refusing it leaves
          ${artist} approved and every other picture of theirs still on offer.</p>
        <h2 style="margin-top:4px">${acqEsc(w.title || "untitled")}</h2>
        <p class="sub">${artist}${quality}
          ${slCount(w.sitelinks) ? ` · ${slCount(w.sitelinks)} language${slCount(w.sitelinks) === 1 ? "" : "s"}` : ""}
          ${w.generator ? ` · found by ${acqEsc(w.generator)}` : ""}
          · <a href="https://www.wikidata.org/wiki/${acqEsc(w.id)}" target="_blank" rel="noopener">${acqEsc(w.id)}</a>
          · ${workReviewDone} decided</p>
        <img src="/review/candidate/${encodeURIComponent(w.id)}/image?width=1100"
             alt="${acqEsc(w.title || "")}" onerror="approveRetryImage(this)"
             style="max-width:100%;max-height:62vh;object-fit:contain;border-radius:6px;
                    background:var(--card,#f3f3f3);margin:10px 0">
        <p class="sub" style="margin-top:6px"><a href="/review/candidate/${encodeURIComponent(w.id)}/image?width=1400"
           target="_blank" rel="noopener">Open larger →</a>
           &nbsp;·&nbsp; <a href="${acqEsc(w.image_url || "#")}" target="_blank" rel="noopener">original file at the source →</a></p>
        <div style="margin-top:12px">
          <strong style="font-size:13px">Why you are being asked</strong>
          ${workReviewWhy(w)}
        </div>
        <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
          ${workReviewSource === "rights"
            ? `<button onclick="workReviewAct('force')"><strong>Take it anyway</strong> (K)</button>
               <button onclick="workReviewAct('reject')">Leave it (X)</button>`
            : `<button onclick="workReviewAct('keep')"><strong>Keep this picture</strong> (K)</button>
               <button onclick="workReviewAct('reject')">Not this picture (X)</button>`}
          <button onclick="workReviewSkip(1)">Skip (S)</button>
        </div>
        ${workReviewSource === "rights" ? `<p class="sub" style="margin-top:8px">The screener could
        not establish this work's copyright status, so it will not take it on its own. Your
        2026-08-29 exception permits in-copyright works for private display, which is why "take it
        anyway" is offered here — the recorded rights status stays truthful either way.</p>` : ""}
        ${(w.artist_works && w.artist_works.length) ? `
        <p class="sub" style="margin-top:16px"><strong>${w.artist_work_count} pictures by
        ${artist} are waiting, and each is decided on its own card</strong> — this is
        ${w.artist_work_index} of them. Click any of the others to go to its card now; you do not
        have to decide them together.</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          ${w.artist_works.map(s => `<figure style="margin:0;width:120px">
            <a href="#" onclick="workReviewJump(${acqEsc(JSON.stringify(s.id))});return false"
               title="Go to this picture's card">
              ${plainThumb(`/review/candidate/${encodeURIComponent(s.id)}/image?width=240`, s.title, 120)}
            </a>
            <figcaption class="sub" style="font-size:11px;line-height:1.3;margin-top:3px">${acqEsc(s.title || "")}</figcaption>
          </figure>`).join("")}
        </div>` : ""}
        <p class="sub" style="margin-top:12px">Skipping decides nothing — an undecided work stays
        acquirable and comes back.</p>
      </div>`;
    }

    // ----- deferrals: a size call, a failed download, or a broken file -----
    // These were shown as a 68 px icon and a truncated sentence, which is no
    // way to judge image quality. Portrait of Wally was refused for being 3053
    // px against a 3060 floor — seven pixels — and ten of the twenty were
    // transfer failures on the LARGEST images in the pool. The picture and the
    // two numbers are the whole decision.
    let deferQueue = [];
    let deferIdx = 0;
    let deferDone = 0;

    async function loadDeferrals() {
      const r = await fetch("/review/deferred_transfer?limit=200");
      const det = showDetailPanel();
      if (!det) return;
      if (!r.ok) { det.innerHTML = `<h2>Deferred</h2><p class="sub">Could not load (${r.status}).</p>`; return; }
      const g = await r.json();
      deferQueue = g.items || [];
      deferIdx = 0; deferDone = 0;
      if (!deferQueue.length) {
        det.innerHTML = `<button onclick="loadReview()">← All gates</button>
          <h2>Deferred</h2><p class="sub">Nothing deferred right now.</p>`;
        return;
      }
      renderDeferral();
      if (!window._deferKeys) { window._deferKeys = true; document.addEventListener("keydown", deferKey); }
    }

    function deferKey(ev) {
      if (!deferQueue.length || !document.getElementById("defer-card")) return;
      if (ev.target && /INPUT|TEXTAREA/.test(ev.target.tagName)) return;
      const k = ev.key.toLowerCase();
      if (k === "t") { ev.preventDefault(); deferAct("force"); }
      else if (k === "x") { ev.preventDefault(); deferAct("reject"); }
      else if (k === "s" || k === "arrowright") { ev.preventDefault(); deferSkip(1); }
      else if (k === "arrowleft") { ev.preventDefault(); deferSkip(-1); }
      else if (k === "escape") { ev.preventDefault(); loadReview(); }
    }

    function deferSkip(d) {
      if (!deferQueue.length) return;
      deferIdx = (deferIdx + d + deferQueue.length) % deferQueue.length;
      renderDeferral();
    }

    async function deferAct(decision) {
      const cur = deferQueue[deferIdx];
      if (!cur) return;
      const r = await fetch(`/review/works/${encodeURIComponent(cur.id)}/decision`, {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({decision: decision, title: cur.title || ""})
      });
      if (!r.ok) { alert(`Could not record that (${r.status}).`); return; }
      deferQueue.splice(deferIdx, 1);
      deferDone += 1;
      if (deferIdx >= deferQueue.length) deferIdx = 0;
      if (!deferQueue.length) {
        const det = showDetailPanel();
        if (det) det.innerHTML = `<button onclick="loadReview()">← All gates</button>
          <h2>All done</h2><p class="sub">${deferDone} decided.</p>`;
        return;
      }
      renderDeferral();
    }

    function renderDeferral() {
      const w = deferQueue[deferIdx];
      const det = showDetailPanel();
      if (!det || !w) return;
      const d = w.deferral || {};
      let verdict = "", advice = "";
      if (d.kind === "below_floor") {
        verdict = `<strong>${d.got_px} px</strong> on the long edge, against a
          <strong>${d.need_px} px</strong> floor — <strong>${d.percent_of_floor}%</strong>,
          short by ${d.shortfall_px} px.`;
        advice = d.percent_of_floor >= 95
          ? "A near miss. The floor is 130 PPI across the work's real size; a few percent under it is unlikely to be visible on the panel."
          : "Meaningfully under the floor — it will be upscaled on a large panel.";
      } else if (d.kind === "transfer_failed") {
        // The size below is what the SCREENER read from the catalogue, not a
        // measured file — the download never completed. And whether it is
        // large is computed per work: this branch used to assert "among the
        // largest in the pool" for every one of them, which was true of a
        // 356 MP Titian and false of a 1.0 MP van Eyck.
        const mp = w.megapixels;
        const scale = mp == null ? ""
          : mp >= 50 ? " — one of the largest in the pool"
          : mp >= 10 ? " — a large file"
          : mp >= 4  ? ""
          : " — and that is <strong>small</strong>, so this one may not clear the floor even if it downloads";
        verdict = `The <strong>download</strong> failed; the image was never assessed.
          The catalogue lists it at ${mp == null ? "an unrecorded size" :
          `<strong>${mp} MP</strong> (${w.long_edge_px} px long edge)`}${scale}.`;
        advice = mp != null && mp < 4
          ? "Taking it retries the transfer, but at this catalogue size expect it to be deferred again on the size floor."
          : "Nothing here says the picture is poor. Taking it means letting a slow transfer run to completion.";
      } else if (d.kind === "undecoded") {
        verdict = `The file did not decode, so <em>nothing was measured</em>. The
          &ldquo;0 px&rdquo; in the log is a failure to read, not a measurement.`;
        advice = "This is a defect to look into rather than a quality verdict; the source file may be corrupt or an unsupported format.";
      } else {
        verdict = acqEsc(d.reason || "deferred");
      }
      det.innerHTML = `<div id="defer-card">
        <button onclick="loadReview()">← All gates</button>
        <h2 style="margin-top:8px">${acqEsc(w.title || "untitled")}</h2>
        <p class="sub">${acqEsc(w.artist_label || w.artist_qid || "")}
          ${w.megapixels ? ` · ${w.megapixels} MP` : ""}
          ${w.rights_status ? ` · ${acqEsc(w.rights_status)}` : ""}
          · <a href="https://www.wikidata.org/wiki/${acqEsc(w.id)}" target="_blank" rel="noopener">${acqEsc(w.id)}</a>
          <span class="sub">· ${deferDone} decided · ${deferQueue.length} left</span></p>
        <p style="margin:6px 0">${verdict}</p>
        ${advice ? `<p class="sub">${advice}</p>` : ""}
        <img src="/review/candidate/${encodeURIComponent(w.id)}/image?width=1100"
             alt="${acqEsc(w.title || "")}" onerror="approveRetryImage(this)"
             style="max-width:100%;max-height:58vh;object-fit:contain;border-radius:6px;
                    background:var(--card,#f3f3f3);margin:10px 0">
        ${(w.artist_works && w.artist_works.length) ? `
        <p class="sub" style="margin-top:10px">${w.artist_work_count} works by this artist are
        waiting — the others:</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px">
          ${w.artist_works.map(s => `<figure style="margin:0;width:120px">
            ${decisionThumb(`/review/candidate/${encodeURIComponent(s.id)}/image?width=240`, s.title, 120)}
            <figcaption class="sub" style="font-size:11px;line-height:1.3;margin-top:3px">${acqEsc(s.title || "")}</figcaption>
          </figure>`).join("")}
        </div>` : ""}
        <p class="sub"><a href="/review/candidate/${encodeURIComponent(w.id)}/image?width=1400"
           target="_blank" rel="noopener">Open larger →</a>
           &nbsp;·&nbsp; <a href="${acqEsc(safeHref(w.image_url))}" target="_blank" rel="noopener">original file at the source →</a></p>
        <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
          <button onclick="deferAct('force')"><strong>Take it anyway</strong> (T)</button>
          <button onclick="deferAct('reject')">Not this one (X)</button>
          <button onclick="deferSkip(1)">Skip (S)</button>
        </div>
        <p class="sub" style="margin-top:12px">Taking it overrides the size and speed floors for
        this picture only, and the exception is recorded on the work. Skipping leaves it deferred —
        it stays in the queue and is re-proposed on later ticks.</p>
      </div>`;
    }

    function renderApproval() {
      const cur = approveQueue[approveIdx];
      const det = showDetailPanel();
      if (!det || !cur) return;
      const name = cur.artist_label
        ? acqEsc(cur.artist_label)
        : `<a href="https://www.wikidata.org/wiki/${acqEsc(cur.artist_qid)}" target="_blank" rel="noopener">${acqEsc(cur.artist_qid)}</a>`;
      const works = cur.works || [];
      const hero = works[0];
      // Images come through /review/candidate/{qid}/image, which downscales and
      // caches server-side. Pointing at the Commons original meant a 1.7 MB,
      // 3296 px file per thumbnail and a card that showed grey boxes.
      const src = (w, px) => `/review/candidate/${encodeURIComponent(w.id)}/image?width=${px}`;
      // A 503 from the proxy means the source is throttling, not that the
      // image is missing. Without this the browser paints a broken icon and
      // keeps it for the session, which is how a transient rate-limit became
      // "a number of the pictures don't show".
      const retry = `onerror="approveRetryImage(this)"`;
      const meta = (w) => [
        slCount(w.sitelinks) ? `${slCount(w.sitelinks)} language${slCount(w.sitelinks) === 1 ? "" : "s"}` : null,
        `<a href="https://www.wikidata.org/wiki/${acqEsc(w.id)}" target="_blank" rel="noopener">${acqEsc(w.id)}</a>`
      ].filter(Boolean).join(" · ");

      const heroBlock = hero ? `
        <figure style="margin:0 0 16px 0">
          <img src="${src(hero, 900)}" alt="${acqEsc(hero.title || "")}"
               ${retry}
               style="max-width:100%;max-height:52vh;object-fit:contain;border-radius:6px;background:var(--card,#f3f3f3)">
          <figcaption class="sub" style="margin-top:6px">
            <strong>${acqEsc(hero.title || "untitled")}</strong> — ${meta(hero)}
            · <a href="${src(hero, 1600)}" target="_blank" rel="noopener">open larger →</a>
          </figcaption>
        </figure>` : `<p class="sub">No image available for this artist's candidates.</p>`;

      // Every thumbnail opens full size. A picture you cannot enlarge is not
      // evidence, and this strip is the only view of the rest of what the
      // approval would release.
      const shown = approveShowAll ? works.slice(1) : works.slice(1, 7);
      const strip = shown.map(w => `
        <figure style="margin:0;width:132px">
          <a href="${src(w, 1600)}" target="_blank" rel="noopener" title="open full size">
            <img src="${src(w, 260)}" alt="${acqEsc(w.title || "")}" loading="lazy"
                 ${retry}
                 style="width:132px;height:132px;object-fit:cover;border-radius:4px;
                        background:var(--card,#f3f3f3);cursor:zoom-in"></a>
          <figcaption class="sub" style="font-size:11px;line-height:1.3;margin-top:4px">${acqEsc(w.title || "")}</figcaption>
        </figure>`).join("");
      // "…and 41 more" with no way to reach them hid most of what the decision
      // covers behind a full stop.
      const more = (works.length > 7 && !approveShowAll)
        ? `<p class="sub"><a href="#" onclick="approveShowAll=true;renderApproval();return false">
           Show the other ${works.length - 7} →</a></p>`
        : (approveShowAll && works.length > 7
            ? `<p class="sub"><a href="#" onclick="approveShowAll=false;renderApproval();return false">Show fewer</a></p>`
            : "");

      det.innerHTML = `<div id="approve-card">
        <button onclick="loadReview()">← All gates</button>
        <h2 style="margin-top:8px">${name}</h2>
        <p class="sub">${acqEsc(cur.artist_description || "")}
          ${cur.artist_label ? `· <a href="https://www.wikidata.org/wiki/${acqEsc(cur.artist_qid)}" target="_blank" rel="noopener">${acqEsc(cur.artist_qid)}</a>` : ""}</p>
        <p><strong>${cur.n_released}</strong> work${cur.n_released === 1 ? "" : "s"} released by this decision.
           ${cur.n_held_elsewhere ? `<span class="sub">${cur.n_held_elsewhere} more stay held for a
           separate reason — a flagged subject, usually — and need their own call.</span>` : ""}
           <span class="sub">· ${approveDone} decided · ${approveQueue.length} left</span></p>
        ${heroBlock}
        <div style="display:flex;gap:10px;flex-wrap:wrap">${strip}</div>
        ${more}
        <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">
          <button onclick="approveAct('approve')"><strong>Approve</strong> (A)</button>
          <button onclick="approveAct('reject')">Never (R)</button>
          <button onclick="approveSkip(1)">Skip (S)</button>
        </div>
        <p class="sub" style="margin-top:12px">Approving lets the growth tick acquire this artist's
        works; it does not acquire anything now. Nothing here expires — close it whenever you like
        and the rest keeps waiting without consequence.</p>
      </div>`;
    }

    // ----- newly-acquired review (grant G55) -----
    // Track A promotes without asking. This is where those works surface so
    // they can be looked at afterwards. It is a VIEW, not a work queue:
    // nothing here blocks growth, expires, or has to be drained.
    let acqFilter = "no";

    async function refreshAcqBadge() {
      try {
        const r = await fetch("/acquisitions?reviewed=no&limit=1");
        if (!r.ok) return;
        const d = await r.json();
        const b = document.getElementById("acq-badge");
        if (!b) return;
        if (d.unreviewed > 0) { b.textContent = d.unreviewed; b.style.display = ""; }
        else { b.style.display = "none"; }
      } catch (e) { /* badge is decoration; never break the page for it */ }
    }

    // Acquisition metadata is supplied by sidecars and review events.  This
    // view uses innerHTML for its small table template, so every server value
    // must be escaped before it becomes markup.
    function acqEsc(value) {
      return String(value ?? "").replace(/[&<>"]|'/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[ch]);
    }

    // ----- newly acquired: LOOK at the picture, not at a 68 px icon -----
    // This screen exists so a wrong acquisition can be caught, and it was a
    // table of 68 px thumbnails with a title, a name and a date. That cannot
    // show what actually landed: "The Poppy Field near Argenteuil" was filled
    // from a file named "Poppy Field in a Hollow near Giverny", and nothing on
    // the page could have told you. The card shows the archived picture large,
    // and beside it the source filename and URL the bytes actually came from.
    let acqQueue = [];
    let acqIdx = 0;
    let acqDone = 0;
    let acqView = "cards";

    async function loadAcquisitions(filter) {
      if (filter) acqFilter = filter;
      const r = await fetch(`/acquisitions?reviewed=${acqFilter}&limit=500`);
      // showDetailPanel(), not getElementById: `body:not(.detail-mode) #detail`
      // wins on specificity, so a panel dropped straight into #detail renders
      // and stays invisible. See the note on showDetailPanel.
      const det = showDetailPanel();
      if (!det) return;
      if (!r.ok) { det.innerHTML = `<h2>Newly acquired</h2><p class="sub">Could not load (${r.status}).</p>`; return; }
      const d = await r.json();
      acqQueue = d.works || [];
      acqIdx = 0; acqDone = 0;
      acqMeta = {epoch: d.epoch, unreviewed: d.unreviewed, total: d.total};
      if (!acqQueue.length) { det.innerHTML = acqHeader() + `<p class="sub">Nothing in this view.</p>`; return; }
      if (acqView === "table") renderAcqTable(); else renderAcquisition();
      if (!window._acqKeys) { window._acqKeys = true; document.addEventListener("keydown", acqKey); }
    }

    let acqMeta = {};

    function acqHeader() {
      const tab = (v, label) =>
        `<button onclick="loadAcquisitions('${v}')" style="${v === acqFilter ? "font-weight:600;border-color:var(--accent)" : ""}">${label}</button>`;
      const vw = (v, label) =>
        `<button onclick="acqSetView('${v}')" style="${v === acqView ? "font-weight:600;border-color:var(--accent)" : ""}">${label}</button>`;
      return `<button onclick="closeDetail()">← Back to list</button>
        <h2>Newly acquired</h2>
        <p class="sub">Works the growth automation acquired and promoted on its own,
        since ${acqEsc(acqMeta.epoch || "")}. <strong>${acqMeta.unreviewed}</strong> of ${acqMeta.total} not yet
        looked at. Nothing here is waiting on you — growth does not pause for review, and an
        unread list has no consequence.</p>
        <p style="margin:8px 0">${tab("no", "Not yet looked at")} ${tab("yes", "Looked at")} ${tab("any", "All")}
        &nbsp;·&nbsp; ${vw("cards", "One at a time")} ${vw("table", "Table")}
        &nbsp;·&nbsp; <button onclick="rateAcquisitions()"><strong>Rate them all →</strong></button>
        <span class="sub">opens the full record for each, unrated first</span></p>`;
    }

    function acqSetView(v) {
      acqView = v;
      if (v === "table") renderAcqTable(); else renderAcquisition();
    }

    function acqKey(ev) {
      if (!acqQueue.length || !document.getElementById("acq-card")) return;
      if (ev.target && /INPUT|TEXTAREA/.test(ev.target.tagName)) return;
      const k = ev.key.toLowerCase();
      if (k === "r") { ev.preventDefault(); acqAct(false); }
      else if (k === "s" || k === "arrowright") { ev.preventDefault(); acqSkip(1); }
      else if (k === "arrowleft") { ev.preventDefault(); acqSkip(-1); }
      else if (k === "escape") { ev.preventDefault(); closeDetail(); }
    }

    function acqSkip(delta) {
      if (!acqQueue.length) return;
      acqIdx = (acqIdx + delta + acqQueue.length) % acqQueue.length;
      renderAcquisition();
    }

    async function acqAct(undo) {
      const cur = acqQueue[acqIdx];
      if (!cur) return;
      const r = await fetch(`/works/${encodeURIComponent(cur.work_id)}/acquisition_review`, {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({undo: !!undo, note: ""}),
      });
      if (!r.ok) { toast("failed: " + r.status); return; }
      refreshAcqBadge();
      acqDone += 1;
      if (acqFilter === "no") {
        acqQueue.splice(acqIdx, 1);
        if (acqIdx >= acqQueue.length) acqIdx = 0;
        if (!acqQueue.length) {
          const det = showDetailPanel();
          if (det) det.innerHTML = acqHeader() +
            `<h3>All looked at</h3><p class="sub">${acqDone} work${acqDone === 1 ? "" : "s"} this sitting.</p>`;
          return;
        }
      } else {
        acqQueue[acqIdx].reviewed = !undo;
      }
      renderAcquisition();
    }

    // Every fact the sidecar recorded about where these bytes came from.
    // A missing measurement says so; it is never printed as a number.
    function acqEvidence(w) {
      const rows = [];
      if (w.holder_name) rows.push(["Holder", acqEsc(w.holder_name)]);
      rows.push(["Source", w.source
        ? acqEsc(w.source) + (w.scaled_rendition
            ? ` <span class="sub">· a scaled rendition, not the source's full original</span>` : "")
        : `<span class="sub">not recorded</span>`]);
      if (w.source_filename) {
        rows.push(["File fetched", `<code style="font-size:11px">${acqEsc(w.source_filename)}</code>
          <div class="sub" style="font-size:11px">Compare this with the title above — they are
          often in different languages, but they should describe the same picture.</div>`]);
      }
      rows.push(["File", w.file_health === "truncated"
        ? `<strong>truncated — will not open</strong>`
        : (w.file_health === "ok"
            ? `<span class="sub">opens correctly</span>`
            : `<span class="sub">not checked — this is not a clean bill</span>`)]);
      rows.push(["Size", w.pixels_measured
        ? `${w.width_px} × ${w.height_px} px · ${w.megapixels} MP · ${w.master_mb} MB`
        : `<span class="sub">the archived file could not be measured — that is a defect to look
           at, not a small picture</span>`]);
      rows.push(["Rights", w.rights_status
        ? acqEsc(w.rights_status) + (w.rights_evidence_url
            ? ` · <a href="${acqEsc(w.rights_evidence_url)}" target="_blank" rel="noopener">evidence →</a>` : "")
        : `<span class="sub">not determined</span>`]);
      rows.push(["Acquired", `${acqEsc((w.acquired_at || "").slice(0, 16).replace("T", " "))}
        by ${acqEsc(w.acquired_by || "—")}`]);
      const links = [];
      if (w.source_url) links.push(`<a href="${acqEsc(w.source_url)}" target="_blank" rel="noopener">the file at its source →</a>`);
      if (w.wikidata_q) links.push(`<a href="https://www.wikidata.org/wiki/${acqEsc(w.wikidata_q)}" target="_blank" rel="noopener">${acqEsc(w.wikidata_q)} on Wikidata →</a>`);
      if (links.length) rows.push(["Check against", links.join("&nbsp;·&nbsp;")]);
      return `<table style="margin-top:10px"><tbody>${rows.map(([k, v]) =>
        `<tr><td class="sub" style="white-space:nowrap;vertical-align:top;padding-right:12px">${k}</td>
             <td>${v}</td></tr>`).join("")}</tbody></table>`;
    }

    function renderAcquisition() {
      const w = acqQueue[acqIdx];
      const det = showDetailPanel();
      if (!det || !w) return;
      // Name pinned by tests/test_acquisition_review.py — this is the escaping
      // boundary for a work id that goes into an onclick attribute.
      const workIdJs = acqEsc(JSON.stringify(String(w.work_id ?? "")));
      det.innerHTML = acqHeader() + `<div id="acq-card">
        <p class="sub">Work ${acqIdx + 1} of ${acqQueue.length}${acqDone ? ` · ${acqDone} looked at this sitting` : ""}
          · looking at one of these changes nothing except this list — it does not accept,
          reject or re-acquire anything.</p>
        <h3 style="margin:4px 0">${acqEsc(w.title || "untitled")}</h3>
        <p class="sub">${acqEsc(w.artist_name || "unknown artist")}${w.year ? ` · ${acqEsc(w.year)}` : ""}
          · <span class="qid">${acqEsc(w.work_id)}</span></p>
        ${w.file_health === "truncated" ? `
        <div style="border:1px solid var(--accent,#c00);border-radius:6px;padding:10px;margin:10px 0">
          <strong>The archived file is truncated — the download did not finish.</strong>
          <div class="sub">Its header still claims
          ${w.pixels_measured ? `${w.width_px} × ${w.height_px} px` : "full dimensions"}, which is why
          it looks like a normal acquisition in every list. Nothing can display it. This is a
          transfer defect to re-fetch, not a judgement about the picture — do not reject the work
          over it.</div>
        </div>` : ""}
        <img src="/works/${encodeURIComponent(w.work_id)}/image?max=1400"
             alt="${acqEsc(w.title || "")}" onerror="approveRetryImage(this)"
             style="max-width:100%;max-height:62vh;object-fit:contain;border-radius:6px;
                    background:var(--card,#f3f3f3);margin:10px 0">
        <p class="sub"><a href="/works/${encodeURIComponent(w.work_id)}/image?max=4000"
           target="_blank" rel="noopener">Open the archived file full size →</a>
           &nbsp;·&nbsp; <a href="#" onclick="openWork(${workIdJs});return false">open its full record (to rate it) →</a></p>
        ${acqEvidence(w)}
        <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
          ${w.reviewed
            ? `<button onclick="acqAct(true)">Mark not looked at (undo)</button>`
            : `<button onclick="acqAct(false)"><strong>Looked at it</strong> (R)</button>`}
          <button onclick="acqSkip(1)">Skip (S)</button>
        </div>
        ${w.reviewed ? `<p class="sub" style="margin-top:8px">Marked looked at
          ${acqEsc((w.reviewed_at || "").slice(0, 10))}${w.reviewed_by ? ` by ${acqEsc(w.reviewed_by)}` : ""}.
          ${w.review_note ? `<br>Note: ${acqEsc(w.review_note)}` : ""}</p>` : ""}
      </div>`;
    }

    // The table stays available for scanning a long list, but it is not where
    // a judgement gets made and no longer pretends to be: it links into the
    // card rather than offering a decision button beside a 68 px icon.
    function renderAcqTable() {
      const det = showDetailPanel();
      if (!det) return;
      let html = acqHeader() + `<table><thead><tr>
          <th></th><th>Work</th><th>Size</th><th>Acquired</th><th>Looked at</th><th></th>
        </tr></thead><tbody>`;
      acqQueue.forEach((w, i) => {
        const when = acqEsc((w.acquired_at || "").slice(0, 16).replace("T", " "));
        html += `<tr>
          <td style="width:110px">${heldThumb(w.work_id, 100)}</td>
          <td><strong>${acqEsc(w.title)}</strong>
              <span class="sub">(${acqEsc(w.artist_name)})</span><br>
              <span class="qid">${acqEsc(w.work_id)}</span></td>
          <td class="sub">${w.file_health === "truncated"
              ? `<strong>truncated</strong>`
              : (w.pixels_measured ? `${w.megapixels} MP` : "not measured")}</td>
          <td class="sub">${when}</td>
          <td class="sub">${w.reviewed
              ? acqEsc((w.reviewed_at || "").slice(0, 10)) +
                (w.review_note ? `<br>${acqEsc(w.review_note)}` : "")
              : "—"}</td>
          <td><button onclick="acqOpenCard(${i})">Look at it</button></td>
        </tr>`;
      });
      html += "</tbody></table>";
      det.innerHTML = html;
    }

    function acqOpenCard(i) { acqIdx = i; acqView = "cards"; renderAcquisition(); }

    // Hand the whole set of autonomous acquisitions to the rating view, in the
    // order that puts the unrated ones first. The queue is COMPUTED server-side,
    // so it keeps including works the tick acquires after this page loaded — a
    // frozen list would quietly stop growing and read as "you have rated
    // everything".
    async function rateAcquisitions() {
      const picker = document.getElementById("queue-picker");
      if (picker) {
        const opt = Array.from(picker.options).find(o => o.value === "autonomous-acquisitions");
        if (opt) { picker.value = "autonomous-acquisitions"; await loadQueueFromPicker(); return; }
      }
      // The picker has not populated yet (or is absent) — load it directly
      // rather than failing silently.
      try {
        const r = await fetch("/queues/autonomous-acquisitions");
        if (!r.ok) { toast(`could not load the rating queue (${r.status})`); return; }
        const d = await r.json();
        closeDetail();
        renderListPayload(d);
        if (d.works && d.works.length) openWork(d.works[0].work_id);
      } catch (e) { toast("could not load the rating queue"); }
    }

    async function upgradeDecide(wid, decision) {
      const r = await fetch(`/variant_upgrades/${encodeURIComponent(wid)}/decision`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({decision, note: ""}),
      });
      if (!r.ok) { toast("failed: " + r.status); return; }
      toast(`${decision} logged for ${String(wid).slice(0, 7)}…`);
      // Record it on the row and move on. Reloading the whole list snapped
      // back to the first candidate after every decision, which on a queue is
      // a way to lose your place and re-judge what you just judged.
      const cur = upgQueue[upgIdx];
      if (cur && cur.existing_wid === wid) cur.decision = decision;
      if (upgQueue.length > 1) upgSkip(1); else renderUpgrade();
    }

    // Reveal the detail pane for a non-work panel (summary, upgrades, e-paper).
    //
    // Adding only `.open` is NOT enough and silently does nothing: the rule
    // `body:not(.detail-mode) #detail { display: none }` has higher specificity
    // (1,1,1) than `#detail.open` (1,1,0), so the pane stays hidden while the
    // panel's HTML sits inside it. Only openWork() ever set `detail-mode`, which
    // is why "Ratings summary" and "Variant upgrades" rendered their content and
    // showed nothing at all. Verified by computed style, not by reading CSS.
    function showDetailPanel() {
      const det = document.getElementById("detail");
      if (!det) return null;
      document.body.classList.add("detail-mode");
      det.classList.add("open");
      window.scrollTo({ top: 0, behavior: "auto" });
      return det;
    }

    async function loadSummary() {
      const r = await fetch("/ratings/summary");
      const d = await r.json();
      const det = showDetailPanel();
      if (!det) return;
      det.innerHTML =
        `<h2>Ratings summary</h2>
         <div class="sub">${d.n_events} events · ${d.n_works_rated} works rated</div>
         <h3 style="margin-top:16px">Distribution</h3>
         <pre>${JSON.stringify(d.rating_distribution, null, 2)}</pre>
         <h3>By surface</h3>
         <pre>${JSON.stringify(d.by_surface, null, 2)}</pre>
         <h3>Most-rated works</h3>
         <pre>${JSON.stringify(d.most_rated_works, null, 2)}</pre>`;
      window.scrollTo({top: det.offsetTop - 20, behavior: "smooth"});
    }

    // Fetch + render the full per-work rating history into the detail view.
    async function loadRatingHistory(wid) {
      const el = document.getElementById("rating-history");
      if (!el) return;
      try {
        const r = await fetch("/works/" + encodeURIComponent(wid) + "/ratings");
        const d = await r.json();
        const rows = d.ratings || [];
        if (!rows.length) { el.textContent = "No ratings yet."; return; }
        el.innerHTML = rows.map(function(ev) {
          const q = ev.quality != null ? "Q" + ev.quality : "";
          const f = ev.fit != null ? "F" + ev.fit : "";
          const axes = [q, f].filter(Boolean).join("·")
            || (ev.rating != null ? "(legacy) " + ev.rating : "");
          return '<div class="sub">' + (ev.ts || "") + " · " + axes
            + (ev.surface ? " · " + ev.surface : "") + "</div>";
        }).join("");
      } catch (e) { el.textContent = "(rating history unavailable)"; }
    }

    // ----- detail view (vanilla fetch — no htmx race) -----
    async function openWork(wid) {
      dbg("openWork.start", {wid});
      currentWorkId = wid;
      selectedChips = new Set();
      currentQuality = null;
      currentFit = null;
      detailOpenedAt = Date.now();
      // Update queue index — wid may or may not be in the current queue
      queueIndex = workQueue.indexOf(wid);
      // Switch to detail mode (hides list) and update URL hash
      document.body.classList.add("detail-mode");
      history.replaceState(null, "", "#wid=" + encodeURIComponent(wid));
      try {
        const r = await fetch(`/works/${encodeURIComponent(wid)}`);
        if (!r.ok) { toast("load failed: " + r.status); dbg("openWork.http_fail", {status: r.status}); return; }
        const data = await r.json();
        dbg("openWork.loaded", {wid, title: data.title});
        renderDetail(data);
      } catch (e) {
        toast("load error: " + e.message);
        dbg("openWork.error", {wid, error: String(e)});
      }
    }

    function renderDetail(data) {
      const last = data._latest_rating || null;
      // Last values may be on either schema: two-axis (quality+fit) or legacy
      // single-axis (rating). Show whatever was recorded.
      const lastQ = last && last.quality != null ? last.quality : null;
      const lastF = last && last.fit != null ? last.fit : null;
      const lastR = last && last.rating != null ? last.rating : null;
      currentQuality = lastQ;  // pre-select if the user rated before
      currentFit = lastF;
      // Rehydrate the rest of the rating state so reopening a previously
      // rated work shows the user's prior chip/notes/freetext/surface
      // choices instead of a blank slate. Ratings are stored in
      // ratings_log.jsonl regardless of UI display — this is just the
      // display side. Without this rehydration the chips appear "not
      // saved" on reopen, which is what Tim hit on the first two works
      // of subject_sample_100.
      selectedChips = new Set((last && last.selected_reasons) || []);
      const lastFreetext = (last && last.freetext_by_group) || {};
      const lastNotes = (last && last.notes) || "";
      const lastSurface = (last && last.surface) || "companion-app";
      const escAttr = (s) => String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      const escText = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      const det = document.getElementById("detail");
      det.classList.add("open");

      // Build chip groups from the taxonomy fetched at page load.
      let chipsHtml = "";
      if (ratingTaxonomy) {
        for (const g of ratingTaxonomy.groups) {
          chipsHtml += `<div class="chip-group" data-group-key="${g.key}">
            <div class="chip-group-label">${g.label}<span class="sub" style="margin-left:8px">${g.help}${g.exclusive ? " · pick one" : ""}</span></div>
            <div class="chip-row">`;
          for (const c of g.chips) {
            const cid = `${g.key}:${c.id}`;
            const onCls = selectedChips.has(cid) ? " on" : "";
            chipsHtml += `<button type="button" class="chip${onCls}" data-chip-id="${cid}"
              onclick="toggleChip('${cid}', '${g.key}', ${g.exclusive ? "true" : "false"})">${c.label}</button>`;
          }
          chipsHtml += `</div>`;
          if (g.has_freetext) {
            const ph = (g.freetext_placeholder || "Free text").replace(/"/g, "&quot;");
            const ftVal = escAttr(lastFreetext[g.key] || "");
            chipsHtml += `<input type="text" class="chip-freetext" data-group-key="${g.key}"
              placeholder="${ph}" maxlength="500" value="${ftVal}"
              style="width:100%;margin-top:6px;padding:5px 8px;border:1px solid #ccc;border-radius:4px;font:inherit;font-size:13px;box-sizing:border-box">`;
          }
          chipsHtml += `</div>`;
        }
      } else {
        chipsHtml = `<div class="sub">Loading reason chips…</div>`;
      }

      const surfaces = ["companion-app","eink-tela-285","eink-inky-13",
                        "frame-tv-65","frame-tv-55","ipad","sd-card-batch","review"];
      const surfaceOptions = surfaces.map(s =>
        `<option value="${s}"${s===lastSurface?" selected":""}>${s}</option>`).join("");

      // Build the two axis rows. Button count comes from the active scheme.
      const axisRow = (axis, label, help, current) => {
        let h = `<div class="axis-row">
          <div class="axis-label">${label}<span class="axis-help">${help}</span></div>
          <div class="axis-buttons" data-axis="${axis}">`;
        for (let v = 1; v <= RATING_MAX; v++) {
          h += `<button type="button" class="${current === v ? "on" : ""}" data-value="${v}" onclick="setAxis('${axis}', ${v})">${v}</button>`;
        }
        h += `</div></div>`;
        return h;
      };

      const wid = data.work_id;
      const missingSidecar = data._sidecar_status === "missing";
      const missingSidecarPanel = missingSidecar
        ? `<div class="rate-panel">
             <h3>Metadata not staged yet</h3>
             <p class="sub" style="margin:0">${escText(data._sidecar_message || "Metadata is not staged yet for this work.")}</p>
           </div>`
        : "";
      // Queue position display
      const pos = (queueIndex >= 0 && workQueue.length > 0)
          ? `${queueIndex + 1} of ${workQueue.length}` : "—";
      const canPrev = queueIndex > 0;
      const canNext = queueIndex >= 0 && queueIndex + 1 < workQueue.length;

      // Queue badge in the toolbar so the user can see which queue they're
      // walking (esp. in fullscreen where the page-header picker is hidden).
      // Clicking the ✕ exits the queue back to the default browse list
      // without leaving fullscreen.
      const queueBadge = currentQueueName
        ? `<span class="queue-badge" title="Active queue. Click ✕ to exit.">queue: ${currentQueueName}
             <button class="queue-exit" onclick="exitQueue()" title="Exit queue (back to All works)">✕</button>
           </span>`
        : "";
      det.innerHTML =
        `<div class="detail-toolbar">
           <button onclick="closeDetail()">← Back to list</button>
           <button onclick="prevWork()" ${canPrev ? "" : "disabled"} title="Prev (←)">← Prev</button>
           <button onclick="nextWork()" ${canNext ? "" : "disabled"} title="Next (→)">Next →</button>
           <span class="pos">${pos}</span>
           ${queueBadge}
           <div class="spacer"></div>
           <button onclick="toggleFullscreen()" title="Focus / full-screen (shift+F)">⛶ Focus</button>
           <button id="layout-toggle" class="only-fullscreen" onclick="cycleLayout()" title="Cycle panel layout (L)">Layout: right</button>
           <button id="fullres-toggle" class="only-fullscreen" onclick="toggleFullRes()" title="Toggle full-resolution image (R)">${fullResOn ? "↺ Thumb" : "Full-res"}</button>
           <span class="sub">Keys: ←/→ nav · q1-q9/q0 quality · f1-f9/f0 fit (0 = ${RATING_MAX}) · Enter Save & Next · Esc back · shift+F focus · L layout · R full-res</span>
         </div>

         <div class="detail-split">
           <div>
             <div class="image-pane" id="image-pane">
               <img src="${fullResOn ? `/works/${encodeURIComponent(wid)}/image?max=8192` : `/works/${encodeURIComponent(wid)}/image?max=1600`}"
                    alt="${(data.title || "").replace(/"/g,"&quot;")}"
                    onerror="this.outerHTML='<div class=&quot;placeholder&quot;>No image available for this work (${wid})</div>'">
             </div>
             ${(data.modalities && data.modalities.length) ? `<div class="modality-bar">
               <button class="modality-btn active" data-mod="" onclick="setModality('${wid}','')">Visible</button>
               ${data.modalities.map(m => `<button class="modality-btn" data-mod="${m.modality}" onclick="setModality('${wid}','${m.modality}')" title="${(m.source||'') + (m.license?(' · '+m.license):'')}">${m.label || m.modality}</button>`).join("")}
             </div>` : ""}
             ${data._file_health === "truncated" ? `<div class="placeholder"
               style="border:1px solid var(--accent,#c00);padding:8px;margin-top:6px;border-radius:6px">
               <strong>The archived file is truncated — it will not open.</strong>
               <div class="sub">The download did not finish, so there is no picture to judge here.
               Do not rate this one down for it; it needs re-fetching.</div></div>` : ""}
             <div class="image-meta">
               <span>${(data.files?.master?.dimensions_px || []).join(" × ") || ""}</span>
               <span>${data.files?.master?.size_bytes ? (Math.round(data.files.master.size_bytes/1e5)/10) + " MB" : ""}</span>
               <a href="/works/${encodeURIComponent(wid)}/image?max=8192" target="_blank" rel="noopener">View high-res ↗</a>
               <a href="/works/${encodeURIComponent(wid)}/full">Download original ⭳</a>
               ${data.deepzoom && (data.deepzoom.layers||[]).length ? `<button class="dz-open-btn" onclick="openDeepZoom('${wid}', '${(data.title||'').replace(/'/g,"\\'").replace(/"/g,'&quot;')}')" title="Pan &amp; zoom the full gigapixel scan — visible, underdrawing, X-ray, raking light">🔍 Deep zoom (gigapixel)</button>` : ""}
             </div>
           </div>

           <div class="rating-pane">
             <h2 style="margin:0 0 4px">${data.title || "(untitled)"}</h2>
             <div><strong>${data.artist?.name || ""}</strong>
               ${data.artist?.wikidata_q ? `<span class="qid">${data.artist.wikidata_q}</span>` : ""}
               ${data.artist?.relation && data.artist.relation !== "self"
                   ? `<span class="pill">${data.artist.relation}</span>` : ""}
             </div>
             <div class="sub">${data.year || ""} ${data.medium ? " · " + data.medium : ""} · ${(data.files?.variants || []).length} variants · <span class="qid">${wid}</span></div>
             ${missingSidecarPanel}

             <div class="rate-panel">
               <h3 style="margin-top:0">Rate this work</h3>
               ${axisRow("quality", "Quality", "How good a piece of art is this? (somewhat objective)", currentQuality)}
               ${axisRow("fit", "Fit-for-me", "How much do I want to see this in rotation right now?", currentFit)}

               <div class="notes-block" style="margin-top:10px">
                 <label class="sub" style="display:block;margin-bottom:4px">What strikes you? (optional)</label>
                 <textarea id="rate_notes" rows="2" maxlength="1000"
                   placeholder="e.g., 'kinetic energy of the city' · 'just enjoyable, no specific mood' · 'reminds me of…' · skip if nothing comes to mind"
                   style="width:100%;padding:6px 8px;border:1px solid #ccc;border-radius:4px;font:inherit;font-size:14px;resize:vertical;box-sizing:border-box">${escText(lastNotes)}</textarea>
               </div>

               <div class="rate-row" style="margin-top:10px">
                 <button onclick="submitRating('${wid}', false)" style="padding:8px 14px;background:white;color:var(--accent);border:1px solid var(--accent);border-radius:6px;font:inherit;cursor:pointer">Save</button>
                 <button onclick="submitRating('${wid}', true)" style="padding:8px 14px;background:var(--accent);color:white;border:none;border-radius:6px;font:inherit;cursor:pointer">Save & Next →</button>
                 <label class="sub" style="margin-left:auto">Surface
                   <select id="surface_select">${surfaceOptions}</select>
                 </label>
               </div>

               <!-- Chips + subject are wrapped in <details class="rate-section">
                    so applyCollapseDefaults() can collapse them when the
                    viewport is too short to fit the full 1810px panel.
                    Default state is open; collapsed only at fullscreen
                    tier-small / tier-medium (see CSS).
                    The inline .chips-inline-label preserves the original
                    "Quick tags (...)" affordance everywhere except those
                    two tiers, where the summary chip takes its role. -->
               <div class="sub chips-inline-label" style="margin-top:14px">Quick tags (all optional — skip if nothing applies)</div>
               <details class="rate-section" id="rs-chips" open>
                 <summary class="rate-section-summary">Quick tags <span class="sub">(all optional — skip if nothing applies)</span></summary>
                 <div class="chips-area">${chipsHtml}</div>
               </details>

               ${last ? `<div class="sub last-rated-sub" style="margin-top:8px">Last rated ${last.ts} · ${lastQ != null || lastF != null ? `Q${lastQ ?? "—"}·F${lastF ?? "—"}` : (lastR != null ? "(legacy) " + ratingLabel(lastR) : "")}${last.selected_reasons?.length ? " · " + last.selected_reasons.join(", ") : ""}${last.notes ? ` · "${last.notes.replace(/"/g,'&quot;').slice(0,80)}"` : ""}</div>` : ""}
             </div>

             <details class="rate-section" id="rs-history" open>
               <summary class="rate-section-summary">Rating history</summary>
               <div id="rating-history" class="sub">…</div>
             </details>

             <details class="rate-section" id="rs-subject" open>
               <summary class="rate-section-summary">Subject tags</summary>
               ${renderSubjectPanel(data)}
             </details>

             <details class="rate-section" id="rs-dossier" ${data.dossier ? "open" : ""}>
               <summary class="rate-section-summary">About${data.dossier ? "" : ` <span class="sub">(none yet)</span>`}</summary>
               <div class="dossier-body">${renderDossierBrief(data, wid)}</div>
             </details>

             <details style="margin-top:8px">
               <summary class="sub">Raw sidecar JSON</summary>
               <pre>${JSON.stringify(data, null, 2)}</pre>
             </details>
           </div>
         </div>`;

      window.scrollTo({top: 0, behavior: "instant"});

      // If we're already in fullscreen and the user is navigating between
      // works, re-evaluate the auto-layout against the new image's aspect.
      // (Skipped if the user has manually chosen a layout this session.)
      // Also re-collapse rate-sections for the freshly-rendered work.
      maybeApplyAutoLayout();
      applyCollapseDefaults();
      updateRatingHud();
      loadRatingHistory(data.work_id);
    }

    // ----- keyboard shortcuts -----
    // In detail mode:
    //   ← / →           prev / next in queue
    //   q1-q5           set quality (two-keystroke gesture)
    //   f1-f5           set fit
    //   Enter           submit "Save & Next" (the fast queue gesture)
    //   shift+Enter     submit "Save" without advancing
    //   Esc             back to list
    let keyPrefix = null;
    let keyPrefixAt = 0;
    document.addEventListener("keydown", (e) => {
      if (!document.body.classList.contains("detail-mode") || !currentWorkId) return;
      const tag = (e.target.tagName || "").toLowerCase();
      if (tag === "input" || tag === "textarea" || tag === "select") return;

      // Reset prefix if held too long
      if (keyPrefix && Date.now() - keyPrefixAt > 1500) keyPrefix = null;

      if (e.key === "Escape") {
        // In fullscreen, let the browser handle Esc (exits fullscreen) and
        // keep the detail panel intact. Otherwise, close the detail panel.
        if (document.fullscreenElement) {
          keyPrefix = null;
          return;
        }
        e.preventDefault();
        closeDetail();
        keyPrefix = null;
        return;
      }
      if (e.key === "ArrowLeft") { e.preventDefault(); prevWork(); return; }
      if (e.key === "ArrowRight") { e.preventDefault(); nextWork(); return; }
      // Shift+F → focus / fullscreen toggle. Must come before the "f"
      // fit-prefix check below, because plain "f" sends key "f" and
      // shift+f sends "F" — we only want the uppercase one as the
      // fullscreen toggle.
      if (e.key === "F" && e.shiftKey) {
        e.preventDefault();
        toggleFullscreen();
        keyPrefix = null;
        return;
      }
      // R → toggle full-res image (only when already in fullscreen)
      if ((e.key === "r" || e.key === "R") && document.fullscreenElement) {
        e.preventDefault();
        toggleFullRes();
        keyPrefix = null;
        return;
      }
      // L → cycle panel layout (only meaningful in fullscreen)
      if ((e.key === "l" || e.key === "L") && document.fullscreenElement) {
        e.preventDefault();
        cycleLayout();
        keyPrefix = null;
        return;
      }
      if (e.key === "Enter") {
        e.preventDefault();
        submitRating(currentWorkId, !e.shiftKey);  // Enter = save&next, shift+Enter = save only
        return;
      }
      if (e.key === "q" || e.key === "Q") {
        keyPrefix = "quality"; keyPrefixAt = Date.now(); return;
      }
      if (e.key === "f" || e.key === "F") {
        keyPrefix = "fit"; keyPrefixAt = Date.now(); return;
      }
      // Digit follows the prefix. On a 10-point scale, "0" means 10
      // (ten-key style: 1234567890 maps to 1..10). Two-digit (e.g. "10")
      // would require a longer hold and is intentionally not supported —
      // ten-key is faster.
      if (keyPrefix && /^[0-9]$/.test(e.key)) {
        e.preventDefault();
        const v = e.key === "0" ? 10 : parseInt(e.key);
        if (v <= RATING_MAX) setAxis(keyPrefix, v);
        keyPrefix = null;
      }
    });

    // ----- URL hash handling: #wid=<id> opens that work on load -----
    function _widFromHash() {
      const m = location.hash.match(/wid=([^&]+)/);
      return m ? decodeURIComponent(m[1]) : null;
    }
    window.addEventListener("DOMContentLoaded", () => {
      refreshAcqBadge();
      refreshReviewBadge();
      const wid = _widFromHash();
      if (wid) {
        // Wait briefly for the list to load so queueIndex resolves
        setTimeout(() => openWork(wid), 600);
      }
    });
    // Also react to in-session hash changes (e.g. someone pastes a wid URL
    // into the address bar while the app is already loaded — same-page
    // fragment change does NOT re-fire DOMContentLoaded).
    window.addEventListener("hashchange", () => {
      const wid = _widFromHash();
      if (wid && wid !== currentWorkId) openWork(wid);
    });

    // ----- initial taxonomy fetch + works list (htmx for the list only) -----
    (async () => {
      try {
        const r = await fetch("/rating_taxonomy");
        ratingTaxonomy = await r.json();
        dbg("taxonomy.loaded", {n_groups: ratingTaxonomy.groups.length});
      } catch (e) {
        dbg("taxonomy.error", {error: String(e)});
      }
    })();

    // ----- queue picker: populate on load, load queue on selection -----
    // The picker's selection is persisted in localStorage so reloads
    // resume the active queue. Otherwise reload-and-Focus loses the
    // curated set the user is walking through (e.g., the 100-work
    // subject-tagger sample).
    (async () => {
      try {
        const r = await fetch("/queues");
        const d = await r.json();
        const picker = document.getElementById("queue-picker");
        for (const q of (d.queues || [])) {
          const opt = document.createElement("option");
          // A file queue's addressable key is its filename stem, which is also
          // its display name. A computed queue has a readable label and a
          // separate key — sending the label back would 404.
          opt.value = q.key || q.name;
          opt.textContent = `${q.name} (${q.n_works})`;
          opt.title = q.description;
          picker.appendChild(opt);
        }
        // Restore the user's last-loaded queue, if any. Skipped silently
        // when the stored name no longer exists on disk.
        let saved = "";
        try { saved = localStorage.getItem(LS_KEY_QUEUE) || ""; } catch (e) {}
        if (saved && Array.from(picker.options).some(o => o.value === saved)) {
          picker.value = saved;
          // Defer one tick so the default htmx list-load doesn't race
          // and overwrite the queue-loaded list.
          setTimeout(() => loadQueueFromPicker(), 50);
        }
      } catch (e) {
        dbg("queues.fetch.error", {error: String(e)});
      }
    })();

    function exitQueue() {
      // Reset the picker + state to the default browse list. Reachable
      // from inside fullscreen via the ✕ on the queue badge.
      const picker = document.getElementById("queue-picker");
      if (picker) picker.value = "";
      currentQueueName = null;
      try { localStorage.removeItem(LS_KEY_QUEUE); } catch (e) {}
      htmx.ajax("GET", "/works?limit=50", "#results");
      toast("exited queue · loaded All works");
      // Re-render the current detail view so the badge disappears.
      if (currentWorkId) openWork(currentWorkId);
    }

    async function loadQueueFromPicker() {
      const picker = document.getElementById("queue-picker");
      const name = picker.value;
      currentQueueName = name || null;
      try { localStorage.setItem(LS_KEY_QUEUE, name || ""); } catch (e) {}
      if (!name) {
        // Reset to default list
        htmx.ajax("GET", "/works?limit=50", "#results");
        return;
      }
      try {
        const r = await fetch(`/queues/${encodeURIComponent(name)}`);
        if (!r.ok) { toast("queue load failed: " + r.status); return; }
        const d = await r.json();
        // Reuse the existing list renderer by feeding it a synthetic
        // /works-shaped response.
        renderListPayload(d);
        // Auto-open the first work so the user can start rating immediately.
        if (d.works && d.works.length > 0) {
          setTimeout(() => openWork(d.works[0].work_id), 200);
        }
        toast(`loaded queue "${name}" · ${d.total} works`);
      } catch (e) {
        toast("queue load error: " + e.message);
      }
    }

    // Renderer factored out so both the htmx list handler and the queue
    // loader can use it. Takes a {total, works:[...]} payload.
    // Fetch the set of work_ids that have a dossier (once), then re-render the
    // library so the "has dossier" dots appear. Non-blocking: the grid shows
    // immediately and dots fill in when this resolves.
    async function ensureDossierSet() {
      if (dossierSet !== null) return;
      dossierSet = new Set();  // guard against concurrent loads
      try {
        const r = await fetch("/dossiers");
        const d = await r.json();
        dossierSet = new Set(d.work_ids || []);
        if (galleryMode && lastListPayload) renderListPayload(lastListPayload);
      } catch (e) { dbg("dossiers.load_error", { error: String(e) }); }
    }

    // ---------------- e-paper playlist / SD card builder ----------------
    // Selection is a QUERY over metadata that already exists rather than a new
    // tagging scheme. "Mood" in particular is a named query over palette/theme/
    // setting tags, so moods work on real data today instead of needing 3,411
    // works re-tagged. Counts next to each control come from the live corpus,
    // so an empty facet reads as thin metadata rather than a broken filter.
    let einkFacets = null;
    let einkTargets = null;
    let einkLastPreview = null;

    const einkEsc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    })[c]);

            <label class="sub">Artist<br>
              <select id="ek-artist" style="width:100%"><option value="">any</option>

            <label class="sub">Period<br>
              <select id="ek-period" style="width:100%"><option value="">any</option>

            <label class="sub">Mood<br>
              <select id="ek-mood" style="width:100%"><option value="">any</option>
                ${f.moods.map(m => opt(m.key, m.label, f.mood_counts[m.key] || 0)).join("")}</select></label>
          </div>

          <!-- Tag-family controls are GENERATED from what the archive contains.
               Nothing here is hardcoded, so a family the tagger adds tomorrow
               (theme:, era-depicted: and palette: all appeared after the first
               build) shows up on the next page load with no code change. -->
          <div class="sub" style="margin-top:12px;margin-bottom:4px">
            Filter by tag — ${Object.keys(f.families).length} families found in the archive,
            generated from the data so new tags appear automatically
          </div>
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px">
            ${Object.entries(f.families).map(([fam, d]) => `
              <label class="sub">${einkEsc(fam)} <span style="opacity:.6">(${d.values.length})</span><br>
                <select class="ek-fam" data-family="${einkEsc(fam)}" style="width:100%">
                  <option value="">any</option>
                  ${d.values.map(v => opt(v.tag, v.value, v.count)).join("")}
                </select></label>`).join("")}
          </div>

          <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px">
            <label class="sub">Min rating (fit)<br>
              <select id="ek-fit" style="width:100%"><option value="">any</option>
                ${[6,7,8,9,10].map(n => opt(n, n + "+")).join("")}</select></label>
            <label class="sub">Order<br>
              <select id="ek-sort" style="width:100%">
                ${["fit","year","artist","title","quality","random"].map(x => opt(x, x)).join("")}</select></label>
            <label class="sub">Limit<br>
              <input id="ek-limit" type="number" min="1" max="500" value="30" style="width:100%"
                     oninput="einkSyncSelectionMode()"></label>
            <label class="sub">Selection<br>
              <select id="ek-selmode" style="width:100%" onchange="einkSyncSelectionMode()">
                <option value="ordered">ordered — take the first N by Order</option>
                <option value="preference-diverse">preference-diverse — quality × visual diversity</option>
              </select></label>
            <label class="sub">Rotate every<br>
              <select id="ek-interval" style="width:100%">
                ${(T.intervals || ["hourly","6h","12h","daily","weekly"]).map(x => opt(x, x)).join("")}</select></label>
            <label class="sub">Panel<br>
              <select id="ek-target" style="width:100%">

              <select id="ek-dither" style="width:100%">

            <label class="sub">Fit<br>
              <select id="ek-fitmode" style="width:100%">
                ${["","contain","cover","stretch"].map(x => opt(x, x || "panel default")).join("")}</select></label>
          </div>

          <div class="sub" id="ek-selnote" style="margin-top:6px;opacity:.8"></div>

          <label class="sub" style="display:block;margin-top:10px">
            <input type="checkbox" id="ek-excl" checked> Exclude works tagged

            <span style="opacity:.7">— only excludes works that carry the tag; untagged works are not filtered</span>
