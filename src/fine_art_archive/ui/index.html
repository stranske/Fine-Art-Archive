            <div id="ek-playlists" style="margin-top:8px"></div>
          </fieldset>

              <input id="ek-path" placeholder="card path, e.g. /Volumes/EINK" style="flex:1;padding:6px 8px">

              <button onclick="einkExport(true)" style="padding:6px 12px;border-color:var(--accent);color:var(--accent)">Write card</button>
            </div>
            <div class="sub" style="margin-top:4px">Must be under: ${T.export_roots.join(", ")}</div>

      window.scrollTo({ top: host.offsetTop - 20, behavior: "smooth" });
      einkSyncSelectionMode();
      einkLoadPlaylists();
    }

    // preference-diverse selection requires a limit — the backend raises
    // "preference-diverse selection requires limit" (eink/playlist.py:419).
    // Enforce it here so the mode cannot be REQUESTED without one, rather than
    // letting the request 400 or silently falling back to ordered: the option
    // is disabled and the note says why.
    function einkSyncSelectionMode() {
      const sel = document.getElementById("ek-selmode");
      if (!sel) return;
      const hasLimit = !!String((document.getElementById("ek-limit") || {}).value || "").trim();
      const opt = sel.querySelector('option[value="preference-diverse"]');
      if (opt) opt.disabled = !hasLimit;
      if (!hasLimit && sel.value === "preference-diverse") sel.value = "ordered";
      const note = document.getElementById("ek-selnote");
      if (note) {
        note.textContent = hasLimit
          ? ""
          : "preference-diverse needs a Limit — set one to enable it.";
      }
    }

    function einkSpec() {
      const v = id => (document.getElementById(id) || {}).value || "";
      const on = id => !!(document.getElementById(id) || {}).checked;
      const spec = { sort: v("ek-sort") || "fit" };
      if (v("ek-artist")) spec.artists = [v("ek-artist")];
      if (v("ek-period")) spec.periods = [v("ek-period")];
      // Every generated family select contributes an all_tags clause, so
      // picking "setting:night" + "genre:painting/landscape" means BOTH.
      const tags = [...document.querySelectorAll(".ek-fam")]
        .map(el => el.value).filter(Boolean);
      if (tags.length) spec.all_tags = tags;
      if (v("ek-mood")) spec.moods = [v("ek-mood")];
      if (v("ek-fit")) spec.min_fit = parseInt(v("ek-fit"), 10);
      if (v("ek-limit")) spec.limit = parseInt(v("ek-limit"), 10);
      if (on("ek-excl")) spec.exclude_filters = ["nudity-full", "violence", "disturbing"];
      if (on("ek-dossier")) spec.require_dossier = true;
      // #549's quality × diversity selector runs only when the spec asks for
      // it. The default stays "ordered" so saved playlists keep their
      // ordering; the key is emitted only for the other mode, and only with a
      // limit, matching the backend guard.
      if (v("ek-selmode") === "preference-diverse" && spec.limit) {
        spec.selection_mode = "preference-diverse";
      }
      return spec;
    }

    async function einkSavePlaylist() {
      const name = (document.getElementById("ek-plname") || {}).value || "";
      if (!name.trim()) { toast("give the feed a name first"); return; }
      const body = {
        name: name.trim(), spec: einkSpec(),
        target: document.getElementById("ek-target").value,
        dither: document.getElementById("ek-dither").value,
        fit: document.getElementById("ek-fitmode").value || null,
        interval: document.getElementById("ek-interval").value,
      };
      try {
        const r = await fetch("/eink/playlists", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body) });
        const d = await r.json();
        if (!r.ok) { toast(d.detail || `save failed (${r.status})`); return; }
        toast(`saved "${d.name}" — ${d.resolved_count} works`);
        await einkLoadPlaylists();
      } catch (e) { toast(String(e)); }
    }

    let einkCardPlaylistId = null;

      const host = document.getElementById("ek-playlists");

      try { d = await (await fetch("/eink/playlists")).json(); }
      catch (e) { host.textContent = String(e); return; }

        host.innerHTML = `<div class="sub">No saved feeds yet.</div>`; return;

        ${d.playlists.map(p => `

            <td style="text-align:right;white-space:nowrap">
              <a href="${einkEsc(p.manifest_url)}" target="_blank">manifest</a> ·
              <a href="${einkEsc(p.feed_url)}" target="_blank">view</a> ·
              <a href="#" data-eink-use="${einkEsc(p.id)}">to card</a> ·
              <a href="#" data-eink-del="${einkEsc(p.id)}" data-eink-name="${einkEsc(p.name)}">delete</a>
            </td>
          </tr>`).join("")}
      </table>`;
      host.querySelectorAll("[data-eink-use]").forEach((a) => {
        a.addEventListener("click", (ev) => {
          ev.preventDefault();
          einkUseForCard(a.getAttribute("data-eink-use"));

      host.querySelectorAll("[data-eink-del]").forEach((a) => {

    function einkUseForCard(id) {
      einkCardPlaylistId = id;

          ev.preventDefault(); einkCardPlaylistId = null; banner.textContent = "";
        });
      }
      const el = document.getElementById("ek-path");
      if (el) el.focus();
    }

    async function einkDeletePlaylist(id, name) {
      if (!confirm(`Delete the feed "${name}"?\n\nAny device pointed at its URL will stop updating.`)) return;
      const r = await fetch(`/eink/playlists/${encodeURIComponent(id)}`, { method: "DELETE" });
      if (!r.ok) { toast(`delete failed (${r.status})`); return; }
      if (einkCardPlaylistId === id) einkCardPlaylistId = null;
      await einkLoadPlaylists();
    }

    async function einkPreview() {
      const out = document.getElementById("ek-out");
      const target = document.getElementById("ek-target").value;
      const dither = document.getElementById("ek-dither").value;
      out.innerHTML = '<div class="sub">selecting…</div>';

      try {
        const r = await fetch("/eink/playlist/preview", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ spec: einkSpec(), target, sample: 24 }),
        });

        if (!r.ok) { out.innerHTML = `<div class="sub">${einkEsc(d.detail || r.status)}</div>`; return; }
      } catch (e) { out.innerHTML = `<div class="sub">${einkEsc(e)}</div>`; return; }
      einkLastPreview = d;

      const cov = d.coverage.excluded_for_missing_metadata || {};
      const covTxt = Object.keys(cov).length
        ? `<div class="sub" style="margin-top:2px">Dropped for missing metadata: `

      // returned those records to a screen that rendered none of them — the
      // reason for the choice was computed and discarded on the one screen
      // where the choice is made.
      const num = x => (x === null || x === undefined ? "—" : Number(x).toFixed(3));
      const diags = d.selection_diagnostics || [];
      const diagTxt = diags.length ? `
        <details open style="margin-top:12px">
          <summary class="sub">Why these ${diags.length} were chosen — quality × visual diversity</summary>
          <table class="sub" style="border-collapse:collapse;margin-top:6px;font-size:11px">
            <tr><th align="left" style="padding-right:10px">#</th>
                <th align="left" style="padding-right:10px">work</th>
                <th align="right" style="padding-right:10px">quality</th>
                <th align="right" style="padding-right:10px">nearest selected</th>
                <th align="right">marginal gain</th></tr>
            ${diags.map((g, n) => `<tr>
              <td style="padding-right:10px">${String(n + 1).padStart(3, "0")}</td>
              <td style="padding-right:10px">${einkEsc(g.work_id)}</td>
              <td align="right" style="padding-right:10px">${num(g.quality_contribution)}</td>
              <td align="right" style="padding-right:10px">${num(g.nearest_selected_similarity)}</td>
              <td align="right">${num(g.marginal_determinant)}</td></tr>`).join("")}
          </table>
          <div class="sub" style="margin-top:4px;opacity:.75">Lower "nearest selected" means the work
            adds something the rest of the set does not.</div>
        </details>` : "";

      out.innerHTML = `
        <div><strong>${d.selected}</strong> selected of ${d.matched} matching
          (${d.total_candidates} in archive)${noMaster ? ` — ${noMaster} shown have no local image` : ""}</div>
        ${covTxt}
        ${diagTxt}
        <div class="sub" style="margin-top:10px">Rendered as the panel would show it —
          same fit, range compression and dither as the card:</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:8px">
          ${d.items.map((i, n) => `
            <figure style="margin:0">
              <img loading="lazy" src="/works/${encodeURIComponent(i.work_id)}/eink_preview?target=${encodeURIComponent(target)}&dither=${encodeURIComponent(dither)}${fitQ}&max_px=380"
                   style="width:100%;border:1px solid #ddd;background:#eee" alt="">
              <figcaption class="sub" style="font-size:11px;line-height:1.25;margin-top:3px">
                ${String(n + 1).padStart(3, "0")} · ${einkEsc(i.year || "????")}<br>
                ${einkEsc((i.artist || "—").slice(0, 30))}<br><em>${einkEsc((i.title || "").slice(0, 42))}</em>
              </figcaption>
            </figure>`).join("")}
        </div>`;
    }

    async function einkExport(write) {
      const out = document.getElementById("ek-out");
      const path = (document.getElementById("ek-path") || {}).value || "";
      if (!path) { toast("enter a card path first"); return; }
      if (write && !confirm(`Write the card to ${path}?\n\nFiles from a previous export there will be replaced. Other files are left alone.`)) return;
      const body = {
        spec: einkSpec(), target: document.getElementById("ek-target").value,
        dither: document.getElementById("ek-dither").value,
        fit: document.getElementById("ek-fitmode").value || null,
        path, write, overwrite: true,
      };
      // If a saved feed was chosen, the card uses ITS selection — same code
      // path as the feed, so the card and the frame cannot drift apart.
      if (einkCardPlaylistId) body.playlist_id = einkCardPlaylistId;
      out.insertAdjacentHTML("afterbegin", `<div class="sub" id="ek-status">${write ? "writing card…" : "checking…"}</div>`);
      let d;
      try {
        const r = await fetch("/eink/playlist/export", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        d = await r.json();
        const st = document.getElementById("ek-status");
        if (!r.ok) { st.textContent = d.detail || `error ${r.status}`; return; }
        st.innerHTML = `<strong>${write ? "Wrote" : "Would write"} ${d.written} file(s)</strong>`
          + (write && d.bytes_written ? ` · ${(d.bytes_written / 1e6).toFixed(1)} MB` : "")
          + ` → ${einkEsc(d.path)}`
          + (d.skipped ? ` · ${d.skipped} skipped` : "")
          + (d.palette_measured ? "" : ` · <span style="color:#a06000">colours estimated</span>`);
      } catch (e) {
        const st = document.getElementById("ek-status");
        if (st) st.textContent = String(e);
      }
    }

    function toggleGallery() {
      galleryMode = !galleryMode;
      localStorage.setItem("faaGallery", galleryMode ? "1" : "0");
      const link = document.getElementById("library-toggle");
      if (link) link.textContent = galleryMode ? "☰ List" : "⊞ Gallery";
      if (galleryMode) ensureDossierSet();
      if (lastListPayload) renderListPayload(lastListPayload);
    }

    function ratingCell(w) {
      let rcell = "";
      if (w._last_quality != null || w._last_fit != null) {
        const q = w._last_quality != null ? w._last_quality : "—";
        const f = w._last_fit != null ? w._last_fit : "—";
        rcell = `<span class="rating-badge two-axis" title="Quality × Fit" style="background:var(--accent)">Q${q}·F${f}</span>`;
      } else if (w._last_rating != null) {
        rcell = `<span class="rating-badge" data-r="${w._last_rating}" title="legacy single-axis">${ratingLabel(w._last_rating)}</span>`;
      }
      if (rcell && w._n_ratings > 1) rcell += `<span class="sub" style="margin-left:6px">×${w._n_ratings}</span>`;
      return rcell;
    }

    function renderListPayload(d) {
      lastListPayload = d;
      workQueue = d.works.map(w => w.work_id);
      if (currentWorkId) queueIndex = workQueue.indexOf(currentWorkId);
      const link = document.getElementById("library-toggle");
      if (link) link.textContent = galleryMode ? "☰ List" : "⊞ Gallery";
      const head = `<div class="sub">${d.total} works · showing ${d.works.length}</div>`;

      if (galleryMode) {
        if (dossierSet === null) ensureDossierSet();
        let html = head + `<div class="gallery">`;
        for (const w of d.works) {
          const wid = w.work_id;
          const safeWid = wid.replace(/'/g, "\\'");
          const dot = (dossierSet && dossierSet.has(wid))
            ? `<span class="dossier-dot" title="has dossier">◆</span>` : "";
          const rc = ratingCell(w);
          html += `<figure class="card" data-wid="${wid}" onclick="openWork('${safeWid}')" title="${(w.title || "").replace(/"/g, "&quot;")}">
            <div class="card-thumb">
              <img loading="lazy" src="/works/${encodeURIComponent(wid)}/image?max=400"
                   alt="" onerror="this.closest('.card-thumb').classList.add('noimg')">
              ${rc ? `<span class="card-rating">${rc}</span>` : ""}
              ${dot}
            </div>
            <figcaption>
              <div class="card-title">${w.title || "(untitled)"}</div>
              <div class="card-artist sub">${w.artist_name || ""}${w.year ? " · " + w.year : ""}</div>
            </figcaption>
          </figure>`;
        }
        html += `</div>`;
        document.getElementById("results").innerHTML = html;
        return;
      }

      let html = head + `<table><thead><tr>
                    <th>Title</th><th>Artist</th><th>Year</th><th>Variants</th><th>Rating</th>
                  </tr></thead><tbody>`;
      for (const w of d.works) {
        const wid = w.work_id;
        const safeWid = wid.replace(/'/g, "\\'");
        html += `<tr data-wid="${wid}" onclick="openWork('${safeWid}')">
          <td>${w.title || ""}</td>
          <td>${w.artist_name || ""}
            ${w.artist_wikidata_q ? `<span class="qid">${w.artist_wikidata_q}</span>` : ""}</td>
          <td>${w.year || ""}</td>
          <td>${w.n_variants || 0}</td>
          <td class="rating-cell">${ratingCell(w)}</td>
        </tr>`;
      }
      html += "</tbody></table>";
      document.getElementById("results").innerHTML = html;
    }

    document.body.addEventListener("htmx:afterRequest", (e) => {
      const xhr = e.detail.xhr;
      if (!xhr.responseText) return;
      const path = e.detail.requestConfig.path || "";
      // We only use htmx for the works list now; detail uses vanilla fetch.
      if (!(path === "/works" || path.startsWith("/works?"))) return;
      try {
        const data = JSON.parse(xhr.responseText);
        renderListPayload(data);
        dbg("list.rendered", {n: data.works.length, total: data.total});
      } catch (err) {
        dbg("list.render_error", {error: String(err)});
      }
    });
  </script>
</body>
</html>
